<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Números disponibles — Rifa Embrujada</title>
<link rel="stylesheet" href="style.css">
<style>
  .disp-wrap { width: min(100% - 24px, 760px); margin: 0 auto; padding: 22px 0 36px; }
  .available-card { position: relative; padding: 28px 22px 24px; border-radius: 18px; background: linear-gradient(160deg, #2b1046, #170a24 70%); border: 2px solid var(--orange); box-shadow: var(--shadow); overflow: hidden; text-align: center; }
  .available-web { position: absolute; top: -6px; right: -6px; width: 90px; opacity: .25; filter: invert(1) brightness(2); }
  .available-pumpkin { position: absolute; bottom: -6px; left: -4px; width: 70px; opacity: .9; }
  .available-head, .available-grid, .available-foot { position: relative; z-index: 1; }
  .available-tag { display: inline-block; padding: 5px 14px; border: 1px solid rgba(255,199,99,.75); border-radius: 30px; background: rgba(0,0,0,.28); color: #ffe0a5; font-size: .7rem; font-weight: 700; }
  .available-head h1 { margin-top: 10px; color: var(--cream); font-family: "Creepster", cursive; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 400; letter-spacing: 1px; text-shadow: 3px 3px 0 #16071f; }
  .available-head p { margin-top: 4px; color: #ffcf76; font-size: .85rem; font-weight: 700; }
  .available-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 18px; }
  .available-chip { padding: 7px 0; border-radius: 7px; background: var(--orange); color: #fff; font-weight: 800; font-size: .78rem; text-align: center; }
  .available-chip.taken { background: rgba(255,255,255,.08); color: rgba(255,255,255,.28); text-decoration: line-through; }
  .available-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .available-foot span { padding: 6px 12px; border-radius: 20px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.2); color: #fff4dd; font-size: .72rem; font-weight: 700; }
  .disp-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  @media (max-width: 520px) { .available-grid { grid-template-columns: repeat(8, 1fr); } }
</style>
</head>
<body>
<div class="stars"></div>

<nav class="topbar">
  <a class="topbar-brand" href="index.html">🎃 Rifa Embrujada</a>
  <div class="topbar-nav">
    <a href="index.html">Inicio</a>
    <a href="numeros.html">Números</a>
    <a href="registro.html">Registrar</a>
    <a href="control.html">Control</a>
    <a href="resultado.html">Resultado</a>
  </div>
</nav>

<main class="disp-wrap">
  <div class="available-card" id="availableCard">
    <img src="telarana.png" class="available-web" alt="">
    <img src="calabaza.png" class="available-pumpkin" alt="">
    <div class="available-head">
      <span class="available-tag">Sorteo 31 de octubre · Lotería de Boyacá</span>
      <h1>Números disponibles</h1>
      <p id="availableCount">0 de 100 números libres</p>
    </div>
    <div class="available-grid" id="availableGrid"></div>
    <div class="available-foot">
      <span>Valor $100.000</span>
      <span>Premio $5.000.000</span>
      <span>Últimas 2 cifras</span>
    </div>
  </div>

  <div class="disp-actions">
    <button class="btn btn-green" onclick="sendAvailableNumbersWA()">💬 WhatsApp (texto)</button>
    <button class="btn btn-orange" onclick="downloadAvailableImage()">🖼️ Imagen PNG</button>
    <button class="btn btn-dark" onclick="downloadAvailableNumbers()">📄 Archivo TXT</button>
  </div>

  <a class="back-btn" href="control.html">← Volver al control</a>
</main>

<div class="toast-box" id="toastContainer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<script>
function renderAvailable() {
  const available = new Set(getAvailableNumbers());
  document.getElementById("availableCount").textContent =
    `${available.size} de ${CONFIG.totalNumeros} números libres`;
  let html = "";
  for (let i = 0; i < CONFIG.totalNumeros; i++) {
    const n = String(i).padStart(2, "0");
    html += `<span class="available-chip${available.has(n) ? "" : " taken"}">${n}</span>`;
  }
  document.getElementById("availableGrid").innerHTML = html;
}

function downloadAvailableImage() {
  const card = document.getElementById("availableCard");
  toast("Generando imagen PNG...", "warn");
  html2canvas(card, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: "#120019" })
    .then(canvas => {
      const link = document.createElement("a");
      link.download = "numeros_disponibles.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      toast("Imagen PNG descargada.");
    })
    .catch(err => {
      console.error(err);
      toast("No fue posible generar la imagen. Prueba con Live Server.", "error");
    });
}

renderAvailable();
</script>
</body>
</html>
